<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<title>SM TV — Admin Panel</title>
<style>
:root{--bg:#0a0c12;--surface:#131722;--border:#ffffff14;--txt:#fff;--mut:#9aa3b5;--acc:#ff2d55;--acc2:#ff5c39;--live:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);min-height:100vh;padding:20px 14px 60px;max-width:560px;margin:0 auto}
h1{font-size:22px;font-weight:800}.sub{color:var(--mut);font-size:12.5px;margin:4px 0 18px}
.sec{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--mut);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
button{font-family:inherit;touch-action:manipulation}
.field{margin-bottom:10px}.field label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;letter-spacing:1px}
.field input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;color:#fff;font-size:13px;outline:0}
.field input:focus{border-color:var(--acc)}
.btn{padding:12px 22px;border-radius:12px;font-weight:800;font-size:13px;border:0;cursor:pointer;color:#fff}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));width:100%}
.btn.ghost{background:var(--surface);border:1px solid var(--border)}
.btn.sm{padding:8px 14px;font-size:12px;width:auto}
.btn.danger{color:#ff6b81}
.err{color:#ff6b81;font-size:12px;text-align:center;min-height:18px;margin-top:8px}
.ok{color:var(--live);font-size:12px;text-align:center;min-height:18px;margin-top:8px}
.conn{font-size:11px;font-weight:800;padding:4px 12px;border-radius:99px}
.conn.on{background:#22c55e1e;color:var(--live);border:1px solid #22c55e44}
.conn.off{background:#ffffff12;color:var(--mut)}
.m3urow{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:11px 12px;margin-bottom:8px}
.m3urow.off{opacity:.55}
.m3urow .u{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.row{display:flex;align-items:center;gap:10px}
.badge{font-size:9px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:99px}
.badge.on{background:#22c55e1e;color:var(--live);border:1px solid #22c55e44}
.badge.off{background:#ffffff12;color:var(--mut)}
.switch{width:46px;height:26px;border-radius:99px;background:#ffffff1c;position:relative;flex-shrink:0;border:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--live)}
.switch.on::after{left:23px}
.addbox{display:flex;gap:8px;margin-top:10px}
.addbox input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;color:#fff;font-size:12px;outline:0;min-width:0}
.addbox input:focus{border-color:var(--acc)}
.tier{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;display:flex;gap:12px;align-items:center}
.actions{display:flex;gap:10px}.actions .btn{flex:1}
.back{display:inline-block;color:var(--mut);font-size:13px;font-weight:700;margin-bottom:14px;text-decoration:none}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
</style>
</head>
<body>
<a class="back" href="index.html">&lt; Back to App</a>
<div class="topbar"><h1>SM TV Admin</h1><span class="conn off" id="conn">OFFLINE</span></div>
<p class="sub">Firebase Realtime DB connected console</p>

<div id="loginBox">
<div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" value="mdswampodsarkar@gmail.com"></div>
<div class="field"><label>PASSWORD</label><input id="pass" type="password" placeholder="Enter password"></div>
<button class="btn pri" onclick="login()">LOGIN</button>
<p class="err" id="loginErr"></p>
</div>

<div id="body" style="display:none">
<div class="sec">M3U SOURCES <span id="cnt"></span></div>
<div id="list"></div>
<div class="addbox"><input id="newUrl" placeholder="Paste new M3U link (https://...)"><button class="btn pri sm" style="background:linear-gradient(135deg,var(--acc),var(--acc2))" onclick="add()">ADD</button></div>

<div class="sec">CHANNEL FILTER</div>
<div class="tier"><div style="flex:1"><b style="font-size:13px">Sports channels only</b><br><small style="color:var(--mut);font-size:11px">Off = show every channel in playlists</small></div><button class="switch" id="sw" onclick="toggleSports()"></button></div>

<div class="sec">EVENTS / MATCHES <span id="evcnt"></span></div>
<div id="evlist"></div>
<div class="field"><label>COMPETITION</label><input id="evComp" placeholder="e.g. Premier League, BPL T20"></div>
<div style="display:flex;gap:8px">
<div class="field" style="flex:1"><label>TEAM A</label><input id="evA" placeholder="Arsenal"></div>
<div class="field" style="flex:1"><label>TEAM B</label><input id="evB" placeholder="Chelsea"></div>
</div>
<div style="display:flex;gap:8px;align-items:flex-end">
<div class="field" style="flex:1"><label>DATE + TIME (REAL)</label><input id="evTime" type="datetime-local"></div>
<div class="field"><label>COLOR A</label><input id="evCA" type="color" value="#e11d48" style="width:56px;padding:6px"></div>
<div class="field"><label>COLOR B</label><input id="evCB" type="color" value="#2563eb" style="width:56px;padding:6px"></div>
</div>
<div style="display:flex;gap:8px">
<button class="btn ghost sm" id="evLiveBtn" style="color:#fff" onclick="evLive=!evLive;paintEv()">LIVE: OFF</button>
<button class="btn pri sm" style="flex:1;background:linear-gradient(135deg,var(--acc),var(--acc2))" onclick="addEv()">ADD MATCH</button>
</div>

<div class="sec">SEND NOTIFICATION <span id="ntcnt"></span></div>
<p class="sub" style="margin:-4px 0 10px">Push subscribers: <b id="subCount" style="color:#fff">0</b> (in-app reaches everyone instantly)</p>
<div class="field"><label>TITLE</label><input id="ntTitle" placeholder="e.g. Big match tonight!"></div>
<div class="field"><label>MESSAGE</label><input id="ntMsg" placeholder="e.g. Brazil vs Argentina live at 9 PM"></div>
<button class="btn pri" onclick="sendNt()">SEND TO ALL USERS</button>
<div id="ntlist" style="margin-top:10px"></div>

<div class="sec">APP DATA</div>
<div class="actions"><button class="btn pri" onclick="push()">SAVE TO FIREBASE</button><button class="btn ghost danger" onclick="logout()">LOGOUT</button></div>
<p class="ok" id="msg"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyDykDdg_PUE-uNXEFMGkOqGTIS9r9UkaRM",authDomain:"massenger-v20.firebaseapp.com",databaseURL:"https://massenger-v20-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"massenger-v20",storageBucket:"massenger-v20.firebasestorage.app",messagingSenderId:"756660049752",appId:"1:756660049752:web:7cea19cf70840dacbc372d",measurementId:"G-P4JHE0MQQ7"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var ADMIN_EMAIL="mdswampodsarkar@gmail.com";
var DEF=["https://m3u.devm3u.top/?u=admin&s=5&p=4545&f=.m3u8","https://raw.githubusercontent.com/ahan443/FAST-IPTV/refs/heads/main/z.m3u","https://raw.githubusercontent.com/ahan443/FAST-IPTV/refs/heads/main/56655.m3u","https://raw.githubusercontent.com/ahan443/FAST-IPTV/refs/heads/main/premium121.m3u","https://github.com/abusaeeidx/Mrgify-BDIX-IPTV/raw/main/playlist.m3u"];
var urls=[],off={},sports=true,evts=[],evLive=false,notifs=[];
function $(id){return document.getElementById(id)}
function setConn(on){var c=$("conn");c.textContent=on?"LIVE DB":"OFFLINE";c.className="conn "+(on?"on":"off")}
function login(){var e=$("email").value.trim(),p=$("pass").value;$("loginErr").textContent="";if(e!==ADMIN_EMAIL){$("loginErr").textContent="Unauthorized email";return}
firebase.auth().signInWithEmailAndPassword(e,p).then(function(){afterLogin()}).catch(function(err){$("loginErr").textContent=err.message})}
function afterLogin(){$("loginBox").style.display="none";$("body").style.display="block";setConn(true);load()}
function logout(){firebase.auth().signOut().then(function(){location.reload()})}
function load(){db.ref("smtv").get().then(function(snap){var v=snap.val()||{};urls=v.urls&&v.urls.length?v.urls:DEF.slice();off=v.off||{};sports=v.sportsOnly!==false;paint()}).catch(function(e){$("msg").textContent="DB read failed: "+e.message});db.ref("smtvEvents").get().then(function(snap){evts=snap.val()||[];paintEv()}).catch(function(){});db.ref("smtvNotifs").get().then(function(snap){notifs=snap.val()||[];paintNt()}).catch(function(){});db.ref("smtvTokens").get().then(function(snap){var v=snap.val();$("subCount").textContent=v?Object.keys(v).length:0}).catch(function(){})}
function paint(){$("cnt").textContent=urls.length+" sources";$("sw").className="switch "+(sports?"on":"");$("list").innerHTML=urls.map(function(u,i){var o=!!off[u];return '<div class="m3urow '+(o?"off":"")+'"><div class="row"><div style="flex:1"><b style="font-size:12px">SOURCE '+(i+1)+'</b> <span class="badge '+(o?"off\">OFF":"on\">ON")+'</span></div><button class="switch '+(o?"":"on")+'" onclick="tgl('+i+')"></button><button class="btn ghost sm danger" onclick="del('+i+')">DEL</button></div><div class="u">'+u+'</div></div>'}).join("")}
function add(){var v=$("newUrl").value.trim();if(!v||v.indexOf("http")!==0||urls.indexOf(v)>=0)return;urls.push(v);$("newUrl").value="";paint();push(true)}
function del(i){var u=urls[i];urls.splice(i,1);delete off[u];paint();push(true)}
function tgl(i){var u=urls[i];if(off[u])delete off[u];else off[u]=1;paint();push(true)}
function toggleSports(){sports=!sports;paint();push(true)}
function push(silent){db.ref("smtv").update({urls:urls,off:off,sportsOnly:sports,updatedAt:Date.now()}).then(function(){if(!silent)$("msg").textContent="Saved to Firebase — app updates instantly"}).catch(function(e){$("msg").textContent="Save failed: "+e.message})}
function short3(n){n=(n||"").replace(/\[.*?\]|\(.*?\)/g,"").trim().split(/\s+/);if(n.length>1)return (n[0][0]+n[1][0]).toUpperCase();return (n[0]||"??").slice(0,3).toUpperCase()}
function paintEv(){$("evcnt").textContent=evts.length+" matches";$("evLiveBtn").textContent="LIVE: "+(evLive?"ON":"OFF");$("evlist").innerHTML=evts.map(function(e,i){return '<div class="m3urow"><div class="row"><div style="flex:1"><b style="font-size:12px">'+e.comp+'</b> '+(e.live?'<span class="badge on">LIVE</span>':'<span class="badge off">UPCOMING</span>')+'<br><small style="color:var(--mut)">'+e.aName+' vs '+e.bName+' — '+e.time+'</small></div><button class="btn ghost sm danger" onclick="delEv('+i+')">DEL</button></div></div>'}).join("")}
function addEv(){var comp=$("evComp").value.trim(),a=$("evA").value.trim(),b=$("evB").value.trim(),raw=$("evTime").value;if(!comp||!a||!b||!raw)return;var d=new Date(raw);var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];var hh=d.getHours(),ap=hh>=12?"PM":"AM";hh=hh%12||12;var t=d.getDate()+" "+months[d.getMonth()]+", "+hh+":"+String(d.getMinutes()).padStart(2,"0")+" "+ap;evts.push({comp:comp,aName:a,aShort:short3(a),aColor:$("evCA").value,bName:b,bShort:short3(b),bColor:$("evCB").value,time:t,ts:d.getTime(),live:evLive});$("evA").value="";$("evB").value="";$("evTime").value="";evLive=false;saveEv()}
function delEv(i){evts.splice(i,1);saveEv()}
function saveEv(){db.ref("smtvEvents").set(evts).then(function(){$("msg").textContent="Match saved — app updates instantly";paintEv()}).catch(function(e){$("msg").textContent="Save failed: "+e.message})}
function paintNt(){$("ntcnt").textContent=notifs.length+" sent";$("ntlist").innerHTML=notifs.slice().reverse().map(function(n,ri){var i=notifs.length-1-ri;return '<div class="m3urow"><div class="row"><div style="flex:1"><b style="font-size:12px">'+n.title+'</b><br><small style="color:var(--mut)">'+n.msg+'</small></div><button class="btn ghost sm danger" onclick="delNt('+i+')">DEL</button></div></div>'}).join("")}
function sendNt(){var t=$("ntTitle").value.trim(),m=$("ntMsg").value.trim();if(!t||!m)return;notifs.push({title:t,msg:m,ts:Date.now()});notifs=notifs.slice(-10);$("ntTitle").value="";$("ntMsg").value="";db.ref("smtvNotifs").set(notifs).then(function(){$("msg").textContent="Notification sent to all users";paintNt()}).catch(function(e){$("msg").textContent="Send failed: "+e.message})}
function delNt(i){notifs.splice(i,1);db.ref("smtvNotifs").set(notifs).then(paintNt)}
firebase.auth().onAuthStateChanged(function(u){if(u&&u.email===ADMIN_EMAIL)afterLogin()});
</script>
</body></html>
